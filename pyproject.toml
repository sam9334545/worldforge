[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldforge-bench"
version = "0.1.0"
description = "Grid Energy Ecosystem — a deterministic simulation benchmark for AI world-model formation, with an endogenous electricity market and a full project-finance model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
wfbench = "worldforge_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
